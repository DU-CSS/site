events {
    worker_connections 1024;
}

http {
    server_tokens off;
    charset utf-8;

    # resolve Docker container IP addresses
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # always redirect to https
    server {
        listen 80 default_server;
        server_name _;

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        # use the certificates
        ssl_certificate     /etc/letsencrypt/live/ducss.ie/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ducss.ie/privkey.pem;
        server_name ducss.ie;
        root /var/www/html;
        index index.php index.html index.htm;

        location /api/ {
            set $backend backend:8080;
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $frontend frontend-node:3000;
            proxy_pass http://$frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}